apiVersion: v1
kind: Service
metadata:
  name: pagamento
  namespace: oficina-mecanica
  labels:
    app: pagamento
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  # NodePort 30084 = porta do listener do servico na NLB interna (infra-k8s); o API Gateway chega
  # aqui via VPC Link. Dentro do cluster o servico responde em pagamento.oficina-mecanica:80.
  type: NodePort
  selector:
    app: pagamento
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30084
