name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore OficinaMecanica.Pagamento.slnx

      - name: Build
        run: dotnet build OficinaMecanica.Pagamento.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test OficinaMecanica.Pagamento.slnx --no-build --configuration Release --verbosity normal
